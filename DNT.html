  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --lg-red: #A50034;

    --lg-red-border: #F5C0CC;
    --bg: #f0efed;
    --card-bg: #ffffff;
    --text-primary: #111111;
    --text-secondary: #555555;
    --text-muted: #888888;
    --border: #e8e8e8;

    --shadow-soft: 0 2px 12px rgba(0,0,0,0.06);
  }
  body {

    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px 48px;
    -webkit-text-size-adjust: 100%;
  }

  .top-bar .lg-mark {
    width: 36px; height: 36px; background: var(--lg-red); border-radius: 50%;

    font-size: 13px; font-weight: 700; color: white; letter-spacing: -0.5px;
  }
  .top-bar .site-title { font-size: 14px; font-weight: 500; color: var(--text-secondary); }

  .lookup-card {
    width: 100%; max-width: 420px; background: var(--card-bg);
    border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 18px;
    overflow: hidden; transition: all 0.3s ease;
  }
  .lookup-card-inner { padding: 24px 20px; }
  .lookup-card h2 { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 14px; }

  .lookup-card.collapsed .lookup-card-inner { display: none; }
  .lookup-card-summary {
    display: none; padding: 14px 16px 14px 20px;
    align-items: center; justify-content: space-between;

  .lookup-summary-name { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
